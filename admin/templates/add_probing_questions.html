<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Probing Questions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 600px;
            width: 100%;
            padding: 2.5rem;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2rem;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #7f8c8d;
            margin-bottom: 1rem;
        }

        .form-label {
            font-weight: 500;
            color: #2c3e50;
        }

        .btn-primary, .btn-outline-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 50px;
            border-radius: 8px !important;
            padding: 0.8rem 1.5rem;
        }

        .btn-primary {
            background-color: #4a90e2;
            border: none;
        }

        .btn-primary:hover {
            background-color: #357abd;
        }

        .main-question {
            background-color: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border: 1px solid #e9ecef;
        }

        .btn-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.5rem;
            gap: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Add Probing Questions</h1>
            <div class="main-question">
                <p class="mb-0"><strong>Main Question:</strong> {{ main_question }}</p>
            </div>
        </div>

        <form action="{{ url_for('save_probing_questions') }}" method="post">
            <input type="hidden" name="main_question" value="{{ main_question }}">
            
            <div class="mb-3">
                <label for="probing_question1" class="form-label">Probing Question 1</label>
                <input type="text" class="form-control" id="probing_question1" name="probing_question1" required>
            </div>

            <div class="mb-3">
                <label for="probing_question2" class="form-label">Probing Question 2</label>
                <input type="text" class="form-control" id="probing_question2" name="probing_question2" required>
            </div>

            <div class="mb-3">
                <label for="probing_question3" class="form-label">Probing Question 3</label>
                <input type="text" class="form-control" id="probing_question3" name="probing_question3" required>
            </div>

            <div class="btn-group">
                <a href="{{ url_for('view_questions') }}" class="btn btn-outline-primary">
                    <i class="fas fa-arrow-left me-2"></i>Back to Questions
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-2"></i>Save Probing Questions
                </button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
