<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Questions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            padding: 2rem 1rem;
        }

        .form-container {
            max-width: 900px;
            width: 90%;
            padding: 2.5rem;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2rem;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #7f8c8d;
            margin-bottom: 0;
        }

        .table {
            margin-bottom: 2rem;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #e9ecef;
        }

        .table th {
            background-color: #f8f9fa;
            color: #2c3e50;
            font-weight: 600;
            padding: 1rem;
            border-bottom: 2px solid #e9ecef;
        }

        .table td {
            padding: 1rem;
            vertical-align: middle;
            color: #2c3e50;
        }

        .table tr {
            transition: all 0.3s ease;
        }

        .table tr:hover {
            background-color: #f8f9fa;
        }

        .custom-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-danger {
            background-color: #ff6b6b;
            border: none;
            color: white;
        }

        .btn-danger:hover {
            background-color: #ff5252;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid #e9ecef;
        }

        .btn-primary {
            background-color: #4a90e2;
            border: none;
        }

        .btn-primary:hover {
            background-color: #357abd;
        }

        .btn-secondary {
            background-color: #6c757d;
            border: none;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .btn-dark {
            background-color: #2c3e50;
            border: none;
        }

        .btn-dark:hover {
            background-color: #1a252f;
        }

        .selection-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding: 0.5rem 1rem;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .select-all-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .selection-info {
            color: #7f8c8d;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .form-container {
                padding: 1.5rem;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #7f8c8d;
        }

        .empty-state i {
            font-size: 3rem;
            color: #95a5a6;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="header">
            <h1>Delete Questions</h1>
            <p>Select the questions you want to remove</p>
        </div>

        <form method="POST" action="{{ url_for('delete_questions') }}">
            <div class="selection-controls">
                <div class="select-all-container">
                    <input type="checkbox" id="selectAll" class="custom-checkbox">
                    <label for="selectAll">Select All</label>
                </div>
                <div class="selection-info">
                    <span id="selectedCount">0</span> items selected
                </div>
            </div>

            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr>
                            <th style="width: 60px" class="text-center">Select</th>
                            <th>Question</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for question in questions %}
                        <tr>
                            <td class="text-center">
                                <input type="checkbox" name="selected_questions" value="{{ question.id }}" class="custom-checkbox question-checkbox">
                            </td>
                            <td>{{ question.data.mainQuestion }}</td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="2">
                                <div class="empty-state">
                                    <i class="fas fa-clipboard-list"></i>
                                    <p>No questions available to delete</p>
                                </div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>

            {% if questions %}
            <div class="d-grid mb-4">
                <button type="submit" class="btn btn-danger btn-delete">
                    <i class="fas fa-trash-alt"></i>
                    Delete Selected Questions
                </button>
            </div>
            {% endif %}
        </form>

        <div class="action-buttons">
            <a href="{{ url_for('view_questions') }}" class="btn btn-secondary">
                <i class="fas fa-list"></i>
                View Questions
            </a>
            <a href="{{ url_for('add_question') }}" class="btn btn-primary">
                <i class="fas fa-plus"></i>
                Add Question
            </a>
            <a href="{{ url_for('logout') }}" class="btn btn-dark">
                <i class="fas fa-sign-out-alt"></i>
                Logout
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const selectAllCheckbox = document.getElementById('selectAll');
            const questionCheckboxes = document.querySelectorAll('.question-checkbox');
            const selectedCountElement = document.getElementById('selectedCount');

            function updateSelectedCount() {
                const selectedCount = document.querySelectorAll('.question-checkbox:checked').length;
                selectedCountElement.textContent = selectedCount;
            }

            selectAllCheckbox.addEventListener('change', function() {
                questionCheckboxes.forEach(checkbox => {
                    checkbox.checked = selectAllCheckbox.checked;
                });
                updateSelectedCount();
            });

            questionCheckboxes.forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    const allChecked = Array.from(questionCheckboxes).every(cb => cb.checked);
                    selectAllCheckbox.checked = allChecked;
                    updateSelectedCount();
                });
            });

            updateSelectedCount();
        });
    </script>
</body>
</html>
